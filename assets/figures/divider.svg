<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="44" viewBox="0 0 1280 44" role="presentation">
<style>@font-face { font-family: "Instrument Sans"; font-weight: 600; font-style: normal; src: url(data:font/woff2;base64,) format('woff2'); }
  text { font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b93a1; } .b7 { font-weight: 600; } .caps { letter-spacing: 2px; }
  .car { animation: lap 5.5s cubic-bezier(.45,.05,.55,.95) infinite; }
  @keyframes lap { from { transform: translateX(0); } to { transform: translateX(1160px); } }
  @media (prefers-reduced-motion: reduce) { .car { animation: none; } }
</style>
<defs><linearGradient id="tail" x1="0" x2="1"><stop offset="0" stop-color="#c6ff3d" stop-opacity="0"/><stop offset="1" stop-color="#c6ff3d" stop-opacity=".9"/></linearGradient></defs>
<line x1="40" x2="1240" y1="22" y2="22" stroke="#343a44" stroke-width="2"/>
<line x1="40" x2="40" y1="16" y2="28" stroke="#343a44" stroke-width="2"/><text x="48" y="14" font-size="12" class="b7 muted caps">S1</text><line x1="440" x2="440" y1="16" y2="28" stroke="#343a44" stroke-width="2"/><text x="448" y="14" font-size="12" class="b7 muted caps">S2</text><line x1="840" x2="840" y1="16" y2="28" stroke="#343a44" stroke-width="2"/><text x="848" y="14" font-size="12" class="b7 muted caps">S3</text>
<g transform="translate(1216 13)"><rect width="24" height="18" fill="#c3c9d4"/><rect width="6" height="6" fill="#0b0d10"/><rect x="12" width="6" height="6" fill="#0b0d10"/><rect x="6" y="6" width="6" height="6" fill="#0b0d10"/><rect x="18" y="6" width="6" height="6" fill="#0b0d10"/><rect y="12" width="6" height="6" fill="#0b0d10"/><rect x="12" y="12" width="6" height="6" fill="#0b0d10"/></g>
<g class="car"><rect x="-60" y="20" width="110" height="4" fill="url(#tail)"/><circle cx="52" cy="22" r="6" fill="#c6ff3d"/></g>
</svg>
